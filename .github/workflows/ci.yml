name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # The suite runs against the deterministic provider: no secrets, no
      # network calls, no spend in CI.
      LLM_PROVIDER: stub
      LOG_FORMAT: text
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app tests

      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Smoke-run the agent end to end
        run: python -m app.main

  locked:
    name: locked install (pinned versions)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: stub
      LOG_FORMAT: text
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The quality job installs the declared ranges so upstream drift shows up.
      # This job installs requirements.lock, so the exact verified set is proven
      # to still work. If these two ever disagree, the lock needs refreshing.
      - name: Install pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Test
        run: pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t regguard:ci .
      - name: Boot the API and check health
        run: |
          docker run -d --name regguard -p 8000:8000 -e LLM_PROVIDER=stub regguard:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "health check never passed"; docker logs regguard; exit 1
